apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmark-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookmark-api
  template:
    metadata:
      labels:
        app: bookmark-api
    spec:
      containers:
        - name: bookmark-api
          image: YOUR_REGISTRY/bookmark-api:REPLACE_ME
          ports:
            - containerPort: 4567
